[package]
name = "loopcut"
description = "LoopCut — GIF maker with a video-editor workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "loopcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }
serde_json = { workspace = true }

[dependencies]
loopcut-core = { workspace = true }
loopcut-media = { workspace = true }
loopcut-render = { workspace = true }
loopcut-export = { workspace = true }
loopcut-hw = { workspace = true }
loopcut-preview = { workspace = true }

tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-opener = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
http = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Physical memory size (the default frame-cache budget is a quarter of RAM, capped at 2 GiB) and drive types
# (mapped network drives are detected before any path is canonicalized).
windows = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
