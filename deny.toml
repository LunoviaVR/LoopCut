# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Run locally with:  cargo deny check licenses advisories bans sources
# CI runs the same checks through EmbarkStudios/cargo-deny-action.

[graph]
# Evaluate every platform so Linux/macOS-only transitive dependencies are license-checked too.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------------------------------------------
# Advisories: RustSec vulnerabilities and unmaintained crates.
# ---------------------------------------------------------------------------------------------------------------
[advisories]
# Vulnerabilities (RustSec "vulnerability" and yanked crates) always fail the check. Unmaintained and unsound
# advisories fail only when they hit a crate that a workspace member depends on directly ("workspace" scope).
# Transitive-only unmaintained crates (for example the GTK bindings pulled in by Tauri on Linux) are not blocking;
# they are reviewed when Tauri is upgraded.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
# Each ignored advisory must use the { id = "...", reason = "..." } form so the reason is recorded here.
ignore = []

# ---------------------------------------------------------------------------------------------------------------
# Licenses. LoopCut is GPL-3.0-only, so the allow list is limited to licenses that can be combined with and
# distributed under GPLv3. Copyleft licenses that GPLv3 cannot absorb (e.g. GPL-2.0-only, CDDL, EPL) are not listed.
# ---------------------------------------------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Keep the list exact: an allowed license that no crate uses is reported so it can be removed.
unused-allowed-license = "warn"

[[licenses.exceptions]]
# gifski is AGPL-3.0-or-later. The plan accepts it for this local desktop app: the combined work carries the AGPL
# section 13 network terms, which a local application does not trigger (see THIRD_PARTY_NOTICES, M6). The exception
# is scoped to this crate so no other AGPL dependency is accepted by accident.
crate = "gifski"
allow = ["AGPL-3.0-or-later"]

[licenses.private]
# Workspace crates are ours; they are checked by their own license field.
ignore = false

# ---------------------------------------------------------------------------------------------------------------
# Bans: duplicate versions, wildcard requirements and explicitly banned crates.
# ---------------------------------------------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------------------------------------------
# Sources: only crates.io and no unexpected git dependencies.
# ---------------------------------------------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
